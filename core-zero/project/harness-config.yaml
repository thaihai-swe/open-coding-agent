# CoreZero adopter-owned configuration.
# The embedded kit ships no executable verification gates. The implementing
# agent proposes project-native commands; an adopter explicitly confirms them
# before adding them here.
schema_version: 1
# `deferred` means the seed still needs `/starter-init` review. `ready` means
# an adopter reviewed project context and explicitly confirmed its gates.
project_setup:
  status: deferred # deferred | in_progress | ready
  reviewed_at: null
lifecycle_overrides: {}

gate_defaults:
  on_fail: block

verification:
  # Advisory mode reports evidence gaps without mechanically blocking a
  # repo-owner lifecycle decision. Switch to blocking after gates are trusted.
  mode: advisory

# Add confirmed commands as argv-safe gates, for example:
# gates:
#   - name: test
#     command: ["python3", "-m", "pytest"]
#     on_fail: block
#     category: test
gates: []

thresholds:
  timeout_seconds: 300
  memory_warn_lines: 200
  memory_hard_lines: 3200

context:
  # Portable limits: do not assume an agent exposes its model context window.
  max_injected_tokens: 8000
  reserve_tokens: 2000
  max_bootstrap_tokens: 1200
  max_project_tokens: 1600
  max_feature_tokens: 2000
  max_retrieved_tokens: 2400
  max_source_excerpt_tokens: 900
  max_retrieval_files: 8
  max_tool_output_tokens: 1200
  payload_budget: 3000
  retrieval:
    roots: [.]
    exclude: [".git", ".corezero", "node_modules", "dist", "build", "coverage", "core-zero/generated"]
  profiles:
    bootstrap: {payload: 3500}
    research: {payload: 6000}
    requirements: {payload: 6000}
    planning: {payload: 6000}
    implement: {payload: 6000}
    verify: {payload: 6000}
    compact: {payload: 3500}
